<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1f2937, #0f172a 58%);
        color: #e2e8f0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      .panel {
        width: min(980px, 92vw);
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 18px;
        backdrop-filter: blur(8px);
        padding: 1rem;
      }

      .controls {
        display: flex;
        justify-content: space-between;
        gap: 0.75rem;
        align-items: center;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }

      .controls-left {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
      }

      select {
        appearance: none;
        border-radius: 10px;
        border: 1px solid #334155;
        background: #0f172a;
        color: #e2e8f0;
        padding: 0.55rem 0.8rem;
        font-size: 1rem;
        min-width: 160px;
      }

      #add-custom {
        appearance: none;
        border-radius: 10px;
        border: 1px solid #334155;
        background: #0f172a;
        color: #e2e8f0;
        padding: 0.55rem 0.6rem;
        font-size: 1rem;
        margin-left: 0.5rem;
        cursor: pointer;
      }

      #meta {
        color: #94a3b8;
        font-size: 0.95rem;
        text-align: right;
      }

      #grid {
        display: grid;
        gap: 6px;
        justify-content: center;
      }

      .box {
        border-radius: 3px;
        background: #334155;
        border: 1px solid rgba(148, 163, 184, 0.12);
      }

      .box.done {
        background: #22c55e;
        border-color: rgba(22, 163, 74, 0.8);
      }

      @media (max-width: 640px) {
        .controls {
          flex-direction: column;
          align-items: stretch;
        }

        .controls-left {
          width: 100%;
        }

        #meta {
          text-align: left;
        }

        #add-custom {
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="controls">
        <div class="controls-left">
          <select id="target" aria-label="Target"></select>
          <button id="add-custom" aria-label="Add custom target">+ Custom</button>
          <select id="unit" aria-label="Unit">
            <option value="days">Days</option>
          </select>
        </div>
        <div id="meta"></div>
      </div>
      <section id="grid" aria-label="time grid"></section>
    </main>

    <script>
      const START_DATE = "2026-08-26";

      const targets = [
        { label: "P", date: "2027-06-19", start: START_DATE },
        { label: "C", date: "2027-10-18", start: START_DATE },
        { label: "A", date: "2028-10-17", start: START_DATE },
        { label: "D", date: "2100-10-17", start: START_DATE },
      ];

      const dayMs = 24 * 60 * 60 * 1000;

      const targetSelect = document.getElementById("target");
      const unitSelect = document.getElementById("unit");
      const addCustomBtn = document.getElementById("add-custom");
      const grid = document.getElementById("grid");
      const meta = document.getElementById("meta");

      targets.forEach((item) => {
        const option = document.createElement("option");
        option.value = item.label;
        option.textContent = item.label;
        option.dataset.date = item.date;
        option.dataset.start = item.start;
        targetSelect.appendChild(option);
      });

      addCustomBtn.addEventListener("click", () => {
        const date = prompt("Enter target date (YYYY-MM-DD):");
        if (!date) return;
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) {
          alert("Invalid date format — please use YYYY-MM-DD");
          return;
        }

        let label = prompt("Enter label (short name shown in the select):", "T");
        if (label === null) return;
        label = label.trim() || "T";

        const value = "custom-" + Date.now();
        const option = document.createElement("option");
        option.value = value;
        option.textContent = label;
        option.dataset.date = date;
        option.dataset.start = getTodayIsoUtc(); // start at day created
        targetSelect.appendChild(option);

        targetSelect.value = value;
        render();
      });

      function toUtcMidnight(dateString) {
        const [year, month, day] = dateString.split("-").map(Number);
        return Date.UTC(year, month - 1, day);
      }

      function getTodayUtcMidnight() {
        const now = new Date();
        return Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
      }

      function getTodayIsoUtc() {
        const now = new Date();
        const y = now.getUTCFullYear();
        const m = String(now.getUTCMonth() + 1).padStart(2, "0");
        const d = String(now.getUTCDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }

      function wholeDaysBetween(fromUtc, toUtc) {
        return Math.floor((toUtc - fromUtc) / dayMs);
      }

      function getBoxSize(totalUnits) {
        if (totalUnits > 1000) return 8;
        if (totalUnits > 700) return 9;
        if (totalUnits > 450) return 11;
        if (totalUnits > 250) return 13;
        return 16;
      }

      function render() {
        const selectedOption = targetSelect.selectedOptions[0];
        if (!selectedOption) return;

        const targetDateStr = selectedOption.dataset.date;
        const startDateStr = selectedOption.dataset.start || getTodayIsoUtc();

        const startUtc = toUtcMidnight(startDateStr);
        const todayUtc = getTodayUtcMidnight();
        const targetUtc = toUtcMidnight(targetDateStr);

        const totalDays = Math.max(0, wholeDaysBetween(startUtc, targetUtc));
        let completeDays = Math.max(0, wholeDaysBetween(startUtc, todayUtc));
        completeDays = Math.min(completeDays, totalDays);
        const remainingDays = Math.max(0, totalDays - completeDays);

        const boxSize = getBoxSize(totalDays);
        const columns = Math.max(
          12,
          Math.min(36, Math.floor((window.innerWidth * 0.9) / (boxSize + 6)))
        );

        grid.style.gridTemplateColumns = `repeat(${columns}, ${boxSize}px)`;
        grid.innerHTML = "";

        for (let i = 0; i < totalDays; i++) {
          const box = document.createElement("div");
          box.className = `box${i < completeDays ? " done" : ""}`;
          box.style.width = `${boxSize}px`;
          box.style.height = `${boxSize}px`;
          grid.appendChild(box);
        }

        meta.textContent = `${selectedOption.textContent} • ${completeDays}/${totalDays} days (${remainingDays} left)`;
      }

      targetSelect.value = targets[0].label;
      unitSelect.value = "days";
      unitSelect.disabled = true;

      targetSelect.addEventListener("change", render);
      window.addEventListener("resize", render);

      render();

      // Re-render every minute; at UTC day rollover, one more square becomes green.
      setInterval(render, 60 * 1000);
    </script>
  </body>
</html>
