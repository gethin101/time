<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1f2937, #0f172a 58%);
        color: #e2e8f0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      .panel {
        width: min(980px, 92vw);
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 18px;
        backdrop-filter: blur(8px);
        padding: 1rem;
      }

      .controls {
        display: flex;
        justify-content: space-between;
        gap: 0.75rem;
        align-items: center;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }

      .controls-left {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
      }

      select {
        appearance: none;
        border-radius: 10px;
        border: 1px solid #334155;
        background: #0f172a;
        color: #e2e8f0;
        padding: 0.55rem 0.8rem;
        font-size: 1rem;
        min-width: 160px;
      }

      /* button styling near selects */
      #add-custom {
        appearance: none;
        border-radius: 10px;
        border: 1px solid #334155;
        background: #0f172a;
        color: #e2e8f0;
        padding: 0.55rem 0.6rem;
        font-size: 1rem;
        margin-left: 0.5rem;
        cursor: pointer;
      }

      #meta {
        color: #94a3b8;
        font-size: 0.95rem;
        text-align: right;
      }

      #grid {
        display: grid;
        gap: 6px;
        justify-content: center;
      }

      .box {
        border-radius: 3px;
        background: #334155;
        border: 1px solid rgba(148, 163, 184, 0.12);
      }

      .box.done {
        background: #22c55e;
        border-color: rgba(22, 163, 74, 0.8);
      }

      @media (max-width: 640px) {
        .controls {
          flex-direction: column;
          align-items: stretch;
        }

        .controls-left {
          width: 100%;
        }

        #meta {
          text-align: left;
        }

        #add-custom {
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="controls">
        <div class="controls-left">
          <select id="target" aria-label="Target"></select>
          <button id="add-custom" aria-label="Add custom target">+ Custom</button>
          <select id="unit" aria-label="Unit">
            <option value="days">Days</option>
            <option value="months">Months</option>
            <option value="years">Years</option>
          </select>
        </div>
        <div id="meta"></div>
      </div>
      <section id="grid" aria-label="time grid"></section>
    </main>

    <script>
      const targets = [
        { label: "P", date: "2027-06-19" },
        { label: "C", date: "2027-10-18" },
        { label: "A", date: "2028-10-17" },
        { label: "D", date: "2100-10-17" },
      ];

      const dayMs = 24 * 60 * 60 * 1000;

      const targetSelect = document.getElementById("target");
      const unitSelect = document.getElementById("unit");
      const addCustomBtn = document.getElementById("add-custom");
      const grid = document.getElementById("grid");
      const meta = document.getElementById("meta");

      // Populate built-in targets
      targets.forEach((item) => {
        const option = document.createElement("option");
        option.value = item.label;
        option.textContent = item.label;
        targetSelect.appendChild(option);
      });

      // Temporary custom targets are stored only in the DOM as option.dataset.date.
      // They are ephemeral and will be lost on page reload (no persistence).
      addCustomBtn.addEventListener("click", () => {
        const date = prompt("Enter date (YYYY-MM-DD):");
        if (!date) return;
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) {
          alert("Invalid date format — please use YYYY-MM-DD");
          return;
        }
        let label = prompt("Enter label (short name shown in the select):", "T");
        if (label === null) return;
        label = label.trim() || `T`;

        const value = "custom-" + Date.now();
        const option = document.createElement("option");
        option.value = value;
        option.textContent = label;
        option.dataset.date = date;
        targetSelect.appendChild(option);
        targetSelect.value = value;
        render();
      });

      function toUtcMidnight(dateString) {
        const [year, month, day] = dateString.split("-").map(Number);
        return Date.UTC(year, month - 1, day);
      }

      function getTodayUtcMidnight() {
        const now = new Date();
        return Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
      }

      function daysBetween(fromUtc, toUtc) {
        return Math.max(0, Math.ceil((toUtc - fromUtc) / dayMs));
      }

      function monthsBetween(fromDate, toDate) {
        let months =
          (toDate.getUTCFullYear() - fromDate.getUTCFullYear()) * 12 +
          (toDate.getUTCMonth() - fromDate.getUTCMonth());

        if (toDate.getUTCDate() > fromDate.getUTCDate()) {
          months += 1;
        }

        return Math.max(0, months);
      }

      function yearsBetween(fromDate, toDate) {
        let years = toDate.getUTCFullYear() - fromDate.getUTCFullYear();

        const toMonth = toDate.getUTCMonth();
        const fromMonth = fromDate.getUTCMonth();
        const toDay = toDate.getUTCDate();
        const fromDay = fromDate.getUTCDate();

        if (toMonth > fromMonth || (toMonth === fromMonth && toDay > fromDay)) {
          years += 1;
        }

        return Math.max(0, years);
      }

      function getBoxSize(totalUnits) {
        if (totalUnits > 1000) return 8;
        if (totalUnits > 700) return 9;
        if (totalUnits > 450) return 11;
        if (totalUnits > 250) return 13;
        return 16;
      }

      function render() {
        // Support built-in targets (from the targets array) and temporary custom options
        const selectedOption = targetSelect.selectedOptions[0];
        let selected;
        if (selectedOption && selectedOption.dataset && selectedOption.dataset.date) {
          selected = { label: selectedOption.textContent, date: selectedOption.dataset.date };
        } else {
          selected = targets.find((item) => item.label === targetSelect.value) ?? targets[0];
        }
        const unit = unitSelect.value;

        const todayUtc = getTodayUtcMidnight();
        const targetUtc = toUtcMidnight(selected.date);

        const todayDate = new Date(todayUtc);
        const targetDate = new Date(targetUtc);

        let totalUnits = 0;
        let unitLabel = "days";

        if (unit === "months") {
          totalUnits = monthsBetween(todayDate, targetDate);
          unitLabel = "months";
        } else if (unit === "years") {
          totalUnits = yearsBetween(todayDate, targetDate);
          unitLabel = "years";
        } else {
          totalUnits = daysBetween(todayUtc, targetUtc);
          unitLabel = "days";
        }

        const complete = 0;
        const remaining = totalUnits;

        const boxSize = getBoxSize(totalUnits);
        const columns = Math.max(12, Math.min(36, Math.floor((window.innerWidth * 0.9) / (boxSize + 6))));

        grid.style.gridTemplateColumns = `repeat(${columns}, ${boxSize}px)`;
        grid.innerHTML = "";

        for (let i = 0; i < totalUnits; i++) {
          const box = document.createElement("div");
          box.className = `box${i < complete ? " done" : ""}`;
          box.style.width = `${boxSize}px`;
          box.style.height = `${boxSize}px`;
          grid.appendChild(box);
        }

        meta.textContent = `${selected.label} • ${remaining} ${unitLabel} left`;
      }

      targetSelect.value = targets[0].label;
      unitSelect.value = "days";

      targetSelect.addEventListener("change", render);
      unitSelect.addEventListener("change", render);
      // If user adds a custom option it will be selected and render called from the click handler.
      window.addEventListener("resize", render);

      render();

      setInterval(() => {
        render();
      }, 60 * 1000);
    </script>
  </body>
</html>
